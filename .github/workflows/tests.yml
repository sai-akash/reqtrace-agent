name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the package and test dependencies
        run: python -m pip install -e ".[dev,claude]"
      - name: Check the evaluation data
        run: python eval/validate_cases.py
      - name: Run the tests
        run: python -m pytest
